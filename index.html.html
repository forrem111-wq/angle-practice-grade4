<!doctype html><html lang='zh-Hant'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,user-scalable=no'><title>四年級角度高手</title><style>body{font-family:Arial,'Noto Sans TC',sans-serif;margin:0;background:#eef9ff;color:#1e293b}#root{max-width:980px;margin:auto;padding:16px}.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 16px #0001}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.badge{background:#dbeafe;padding:10px 14px;border-radius:12px;font-weight:700}.bar{height:9px;background:#eee;border-radius:9px}.bar i{display:block;height:100%;background:#22c55e;border-radius:9px}.stage{height:470px;position:relative;overflow:hidden;border:1px solid #ddd;border-radius:14px;background:#f8fafc;touch-action:none}.pro{position:absolute;z-index:4;touch-action:none;cursor:grab;transform-origin:160px 160px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.answer{border-radius:12px;padding:10px}.err{border:4px solid #ef4444;background:#fef2f2;animation:blink .65s infinite}.btn{border:0;padding:12px 16px;border-radius:11px;font-weight:700;cursor:pointer}.choice{background:#f1f5f9}.sel{background:#2563eb;color:white}.check{background:#f59e0b;color:white}.next{background:#16a34a;color:white}.choices{display:flex;gap:8px;flex-wrap:wrap}select{width:100%;padding:12px;border:1px solid #bbb;border-radius:10px;font-size:17px}@keyframes blink{50%{opacity:.48}}@keyframes pop{0%{transform:translateY(30px) scale(.2);opacity:0}45%{opacity:1}100%{transform:translateY(-120px) scale(1.25);opacity:0}}.celebrate{position:absolute;inset:0;z-index:20;background:#fff4;pointer-events:none;overflow:hidden}.yay{position:absolute;left:6%;right:6%;top:40%;background:#fffffff2;border:4px solid #facc15;border-radius:24px;padding:25px;text-align:center;font-size:28px;font-weight:900;color:#15803d}.spark{position:absolute;font-size:30px;animation:pop 1.3s ease-out both}.clock{display:block;margin:auto}h1{color:#1d4ed8;margin:0}.hint{font-size:13px;background:#ffffffe8;border:1px solid #ddd;border-radius:10px;padding:9px;position:absolute;bottom:8px;left:8px;z-index:3}</style></head><body><div id='root'></div><script>
const A=[25,40,55,70,90,110,125,140,155,180,35,50,65,80,95,105,120,135,150,165],B=[0,32,118,205,47,155,278,76,192,23,242,95,330,168,61,215,310,132,255,345];const T=[[12,3,'cw'],[3,6,'cw'],[6,9,'cw'],[9,12,'cw'],[12,9,'ccw'],[9,6,'ccw'],[6,3,'ccw'],[3,12,'ccw'],[12,4,'cw'],[2,6,'cw'],[4,9,'cw'],[5,11,'cw'],[12,8,'ccw'],[10,5,'ccw'],[8,2,'ccw'],[7,1,'ccw'],[1,5,'cw'],[2,8,'cw'],[3,11,'cw'],[7,12,'cw'],[11,6,'cw'],[1,8,'ccw'],[4,12,'ccw'],[9,2,'ccw'],[11,3,'cw'],[5,10,'cw'],[8,12,'cw'],[2,9,'ccw'],[6,11,'ccw'],[10,3,'ccw']];const Q=[...A.map((a,i)=>({type:'m',a,base:B[i]})),...T.map(t=>({type:'c',from:t[0],to:t[1],dir:t[2]}))];let idx=0,deg='',kind='',dir='',errs={},p={x:35,y:270,r:0,flip:1},pts=new Map(),start=null;
const cls=a=>a===360?'周角':a===180?'平角':a===90?'直角':a<90?'銳角':'鈍角'; const delta=(a,b,d)=>{let x=(a%12)*30,y=(b%12)*30,z=d==='cw'?(y-x+360)%360:(x-y+360)%360;return z===0?360:z}; const pol=(cx,cy,l,d)=>[cx+l*Math.cos(d*Math.PI/180),cy+l*Math.sin(d*Math.PI/180)];
function proSVG(){let s=`<svg width='320' height='175' viewBox='0 0 320 175' style='pointer-events:none'><path d='M15 160 A145 145 0 0 1 305 160 L15 160Z' fill='rgba(219,234,254,.8)' stroke='#2563eb' stroke-width='2'/>`;for(let d=0;d<=180;d+=5){let r=(180-d)*Math.PI/180,R=145,r2=d%10?136:128;s+=`<line x1='${160+R*Math.cos(r)}' y1='${160-R*Math.sin(r)}' x2='${160+r2*Math.cos(r)}' y2='${160-r2*Math.sin(r)}' stroke='#333'/>`;}for(let d=0;d<=180;d+=10){let r=(180-d)*Math.PI/180;s+=`<text x='${160+114*Math.cos(r)}' y='${164-114*Math.sin(r)}' text-anchor='middle' font-size='9'>${d}</text><text x='${160+96*Math.cos(r)}' y='${164-96*Math.sin(r)}' text-anchor='middle' font-size='9' fill='#dc2626'>${180-d}</text>`}return s+`<circle cx='160' cy='160' r='6' fill='#2563eb'/><line x1='15' y1='160' x2='305' y2='160' stroke='#2563eb' stroke-width='2'/></svg>`}
function clock(q){let s=`<svg class='clock' width='300' height='300' viewBox='0 0 300 300'><circle cx='150' cy='150' r='142' fill='white' stroke='#334155' stroke-width='5'/>`;for(let h=1;h<=12;h++){let r=h*30*Math.PI/180;s+=`<text x='${150+122*Math.sin(r)}' y='${156-122*Math.cos(r)}' text-anchor='middle' font-weight='700'>${h}</text>`}for(let [h,c] of [[q.from,'#2563eb'],[q.to,'#ef4444']]){let r=(h%12)*30*Math.PI/180;s+=`<line x1='150' y1='150' x2='${150+100*Math.sin(r)}' y2='${150-100*Math.cos(r)}' stroke='${c}' stroke-width='5' stroke-linecap='round'/>`}return s+`<circle cx='150' cy='150' r='6'/><text x='150' y='285' text-anchor='middle' font-size='13'>藍色：起點　紅色：終點</text></svg>`}
function render(){let q=Q[idx],opts=q.type==='m'?[...Array(181).keys()]:Array.from({length:12},(_,i)=>(i+1)*30), kinds=q.type==='c'?['銳角','直角','鈍角','平角','周角']:['銳角','直角','鈍角','平角'];let visual='';if(q.type==='m'){let a=pol(350,205,190,q.base),b=pol(350,205,190,q.base+q.a);visual=`<h2>移動並旋轉量角器，將中心點對準角的頂點，再測量角度。</h2><div class='stage'><svg style='position:absolute;width:100%;height:100%;pointer-events:none' viewBox='0 0 700 430'><circle cx='350' cy='205' r='6'/><line x1='350' y1='205' x2='${a[0]}' y2='${a[1]}' stroke='#0f172a' stroke-width='5'/><line x1='350' y1='205' x2='${b[0]}' y2='${b[1]}' stroke='#0f172a' stroke-width='5'/></svg><div id='pro' class='pro' style='left:${p.x}px;top:${p.y}px;transform:rotate(${p.r}deg) scaleX(${p.flip})'>${proSVG()}</div><div class='hint'>電腦：拖曳移動｜滾輪旋轉｜雙擊翻轉<br>平板：一指移動｜兩指扭轉旋轉</div></div>`}else visual=`<h2>從藍色指針旋轉到紅色指針。</h2>${clock(q)}`;
 document.getElementById('root').innerHTML=`<div class='card top'><div><h1>四年級角度高手</h1><div>量角器 × 角的分類 × 時鐘旋轉角</div></div><div class='badge'>第 ${idx+1} / 50 題</div></div><div class='card' style='position:relative;overflow:hidden'><div class='bar'><i style='width:${(idx+1)*2}%'></i></div>${visual}<div class='grid'>${q.type==='c'?`<div class='answer ${errs.dir?'err':''}'><b>① 旋轉方向</b><div class='choices'><button class='btn choice ${dir==='cw'?'sel':''}' onclick="dir='cw';errs.dir=false;render()">↻ 順時針</button><button class='btn choice ${dir==='ccw'?'sel':''}' onclick="dir='ccw';errs.dir=false;render()">↺ 逆時針</button></div></div>`:''}<div class='answer ${errs.deg?'err':''}'><b>${q.type==='c'?'② 旋轉幾度？':'① 角度是多少？'}</b><select onchange="deg=this.value;errs.deg=false;render()"><option value=''>請選擇角度</option>${opts.map(v=>`<option value='${v}' ${String(v)===String(deg)?'selected':''}>${v}°</option>`).join('')}</select></div><div class='answer ${errs.kind?'err':''}'><b>${q.type==='c'?'③ 這個旋轉角是哪一種角？':'② 這是哪一種角？'}</b><div class='choices'>${kinds.map(v=>`<button class='btn choice ${kind===v?'sel':''}' onclick="kind='${v}';errs.kind=false;render()">${v}</button>`).join('')}</div></div></div><div style='margin-top:16px'><button class='btn check' onclick='check()'>檢查答案</button> <span id='msg'></span> <span id='next'></span></div><div id='cele'></div></div>`; bindPro()}
function bindPro(){let e=document.getElementById('pro');if(!e)return;e.onpointerdown=x=>{x.preventDefault();e.setPointerCapture(x.pointerId);pts.set(x.pointerId,{x:x.clientX,y:x.clientY});if(pts.size===1)start={mode:'d',mx:x.clientX,my:x.clientY,x:p.x,y:p.y};else{let z=pair();start={mode:'r',...z,x:p.x,y:p.y,r:p.r}}};e.onpointermove=x=>{if(!pts.has(x.pointerId))return;pts.set(x.pointerId,{x:x.clientX,y:x.clientY});if(pts.size===1&&start?.mode==='d'){p.x=start.x+x.clientX-start.mx;p.y=start.y+x.clientY-start.my}else if(pts.size===2&&start?.mode==='r'){let z=pair(),d=z.ang-start.ang;while(d>180)d-=360;while(d<-180)d+=360;p.x=start.x+z.cx-start.cx;p.y=start.y+z.cy-start.cy;p.r=start.r+d}e.style.left=p.x+'px';e.style.top=p.y+'px';e.style.transform=`rotate(${p.r}deg) scaleX(${p.flip})`};e.onpointerup=x=>{pts.delete(x.pointerId);start=null};e.onwheel=x=>{x.preventDefault();p.r+=x.deltaY>0?5:-5;e.style.transform=`rotate(${p.r}deg) scaleX(${p.flip})`};e.ondblclick=()=>{p.flip*=-1;e.style.transform=`rotate(${p.r}deg) scaleX(${p.flip})`}}
function pair(){let a=[...pts.values()];return {cx:(a[0].x+a[1].x)/2,cy:(a[0].y+a[1].y)/2,ang:Math.atan2(a[1].y-a[0].y,a[1].x-a[0].x)*180/Math.PI}}
function check(){let q=Q[idx],target=q.type==='m'?q.a:delta(q.from,q.to,q.dir);errs={deg:deg===''||Number(deg)!==target,kind:kind!==cls(target),dir:q.type==='c'&&dir!==q.dir};if(errs.deg||errs.kind||errs.dir){render();document.getElementById('msg').innerHTML=`<b style='color:#dc2626'>沒關係，再檢查看看！紅色閃爍的地方需要修改。</b>`;return}celebrate();document.getElementById('msg').innerHTML=`<b style='color:#15803d'>太棒了！全部答對！</b>`;document.getElementById('next').innerHTML=`<button class='btn next' onclick='nextQ()'>✓ 下一題</button>`}
function celebrate(){let c=document.getElementById('cele');c.className='celebrate';c.innerHTML=Array.from({length:28},(_,i)=>`<span class='spark' style='left:${i*37%100}%;top:${i*53%90}%;animation-delay:${i%7*.08}s'>${['🎉','✨','🎊','⭐','👏'][i%5]}</span>`).join('')+`<div class='yay'>🎆 🎉 👏 🎊 🎆<br>太棒了！答對了！</div>`;try{let C=window.AudioContext||window.webkitAudioContext,a=new C();[523,659,784,1047].forEach((f,i)=>{let o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start(a.currentTime+i*.1);o.stop(a.currentTime+i*.1+.1)})}catch(e){}}
function nextQ(){if(idx<49){idx++;deg=kind=dir='';errs={};p={x:35,y:270,r:0,flip:1};render()}else alert('太棒了！50 題全部完成！')};render();
</script></body></html>
